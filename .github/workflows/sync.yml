name: Supermarket Prices Auto-Sync

on:
  push:
    branches: [main]
  schedule:
    # מוגדר לרוץ אוטומטית כל יום ראשון בשעה 03:00 בלילה
    - cron: "0 3 * * 0"
  workflow_dispatch: # מאפשר גם הרצה ידנית בלחיצת כפתור מתוך GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase python-dotenv

      - name: Run price sync script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 sync_prices.py
